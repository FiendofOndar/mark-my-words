name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The eval runners' plumbing, on the offline provider. Spends nothing;
      # a broken case file or script is caught here rather than on a paid run.
      - run: EVAL_PROVIDER=mock npm run eval:intake

  apk:
    name: Debug APK
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 and AGP 8.13 both want JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      # Builds the web app, then copies it into the native project. The web
      # assets are not committed, so this has to run before Gradle sees them.
      # A label a person can read, in place of a hash nobody wants to
      # remember. GitHub's merge commit carries the pull request title in its
      # body, so that is the label; a direct push falls back to the subject.
      # The same label goes into the app (Settings) and the release notes, so
      # "is the phone on the latest build" is answered by reading two lines.
      - name: Label the build
        run: |
          LABEL=$(git log -1 --pretty=%b | sed -n '1p')
          if [ -z "$LABEL" ]; then LABEL=$(git log -1 --pretty=%s); fi
          echo "BUILD_LABEL=$LABEL" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"

      - run: npm run build
        env:
          VITE_BUILD_LABEL: ${{ env.BUILD_LABEL }}
          VITE_BUILD_TIME: ${{ env.BUILD_TIME }}
      - run: npx cap sync android

      - name: Assemble
        id: assemble
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 \
            | tee "$GITHUB_WORKSPACE/gradle.log"

      # Raw job logs are served from blob storage that some networks cannot
      # reach, so a failure is copied into two places that are readable through
      # the API: the job summary, and an issue.
      - name: Report a failure where it can be read
        if: failure() && steps.assemble.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          {
            echo "Gradle failed on \`${{ github.sha }}\`."
            echo
            echo '```'
            if grep -q 'FAILURE: Build failed' gradle.log; then
              grep -A 60 -m 1 'FAILURE: Build failed' gradle.log
            else
              tail -n 200 gradle.log
            fi
            echo '```'
          } > failure.md

          cat failure.md >> "$GITHUB_STEP_SUMMARY"
          gh issue create \
            --title "Android build failed (${{ github.sha }})" \
            --body-file failure.md || echo "could not open an issue; the summary above still has it"

      - name: Name the file after the build
        id: apk
        run: |
          SHORT=$(git rev-parse --short HEAD)
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/mark-my-words-${SHORT}.apk"
          echo "path=out/mark-my-words-${SHORT}.apk" >> "$GITHUB_OUTPUT"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: mark-my-words-debug-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # A rolling release, so the download link never changes and the APK is a
      # direct tap on a phone rather than a zip that needs unpacking.
      #
      # Updated in place rather than deleted and recreated. The old shape
      # failed twice in one morning: the delete hit a GitHub 502 mid-outage,
      # the release survived, and the create then refused because the tag
      # already existed. Every call below is retried, and none of them
      # depends on the previous one having succeeded: a missing release is
      # created, an existing one is edited, and old assets are cleared before
      # the new one is uploaded.
      - name: Publish to the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
          SHORT: ${{ steps.apk.outputs.short }}
        run: |
          retry() {
            local n=0
            until "$@"; do
              n=$((n + 1))
              if [ "$n" -ge 5 ]; then return 1; fi
              echo "attempt $n failed; retrying in $((n * 10))s"
              sleep $((n * 10))
            done
          }

          NOTES="**${BUILD_LABEL}**

          Built ${BUILD_TIME} from \`${SHORT}\`. Settings in the app shows the same line for the installed copy; if the two match, you have this build.

          Tap the .apk below to install. Android will ask permission to install
          from an unknown source; that is expected for a sideloaded app.

          Every build is signed with the same checked-in debug key, so this
          installs over the previous build and keeps your bets and your saved
          API key. Builds before f255f7f (2026-09-13 12:52 UTC) used a throwaway
          key: coming from one of those, uninstall it first, one last time."

          if retry gh release view latest --json tagName >/dev/null 2>&1; then
            retry gh release edit latest --title "Latest build, ${BUILD_TIME}: ${BUILD_LABEL}" --notes "$NOTES" --target "$GITHUB_SHA"
            # Clear old assets so the release carries exactly one APK.
            for asset in $(gh release view latest --json assets --jq '.assets[].name'); do
              retry gh release delete-asset latest "$asset" --yes || true
            done
          else
            retry gh release create latest --title "Latest build, ${BUILD_TIME}: ${BUILD_LABEL}" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          retry gh release upload latest "$APK" --clobber
