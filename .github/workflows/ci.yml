name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  apk:
    name: Debug APK
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 and AGP 8.13 both want JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      # Builds the web app, then copies it into the native project. The web
      # assets are not committed, so this has to run before Gradle sees them.
      - run: npm run build
      - run: npx cap sync android

      - name: Assemble
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the file after the build
        id: apk
        run: |
          SHORT=$(git rev-parse --short HEAD)
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/mark-my-words-${SHORT}.apk"
          echo "path=out/mark-my-words-${SHORT}.apk" >> "$GITHUB_OUTPUT"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: mark-my-words-debug-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # A rolling release, so the download link never changes and the APK is a
      # direct tap on a phone rather than a zip that needs unpacking.
      - name: Publish to the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "${{ steps.apk.outputs.path }}" \
            --title "Latest build (${{ steps.apk.outputs.short }})" \
            --notes "Debug build of \`${{ steps.apk.outputs.short }}\`.

          Tap the .apk below to install. Android will ask permission to install
          from an unknown source; that is expected for a sideloaded app.

          Each build is signed with a throwaway key, so Android will refuse to
          install this over a previous build. Uninstall the old one first."
