<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111014" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23111014'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' fill='%23ede7dc' text-anchor='middle'%3E%E2%80%9D%3C/text%3E%3C/svg%3E"
    />
    <title>Mark My Words</title>
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Applied before first paint so the app never flashes the wrong theme.
      try {
        var t = localStorage.getItem('mmw-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
