<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111014" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 108 108'><rect width='108' height='108' rx='20' fill='%23111014'/><g transform='rotate(-10 54 54)'><rect x='26' y='40' width='56' height='28' rx='5' fill='none' stroke='%23ede7dc' stroke-width='5.5'/><rect x='34.5' y='50.5' width='39' height='7' rx='3.5' fill='%23ede7dc'/></g></svg>" />
    <title>Mark My Words</title>
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Applied before first paint so the app never flashes the wrong theme.
      try {
        var t = localStorage.getItem('mmw-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
