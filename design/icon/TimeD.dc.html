<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    .icon { width: 480px; height: 480px; border-radius: 104px; box-sizing: border-box;
      background: oklch(0.16 0.012 270);
      display: flex; align-items: center; justify-content: center; }
  </style>
</helmet>
<div class="icon">
  <!-- One comma, drawn at scale: the ball is the head, the ring is its tail curled
       all the way round. The gap is the time still to run. -->
  <svg width="340" height="340" viewBox="0 0 240 240">
    <path d="M 176.6 62.1 A 84 84 0 1 1 148.4 40.6" fill="none"
          stroke="oklch(0.95 0.014 88)" stroke-width="30" stroke-linecap="round"/>
    <circle cx="176" cy="64" r="44" fill="oklch(0.95 0.014 88)"/>
    <circle cx="176" cy="64" r="15" fill="oklch(0.16 0.012 270)"/>
  </svg>
</div>
</x-dc>
</body>
</html>
