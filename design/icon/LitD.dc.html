<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap">
  <style>
    body { margin: 0; }
    .icon { width: 480px; height: 480px; border-radius: 104px; box-sizing: border-box;
      background: oklch(0.16 0.012 270); position: relative; overflow: hidden; }
    /* A double quote is a pair. Keep the pairing and the raised position, and
       swap the second mark for a clock of the same size: the pair still reads
       as a quote, and half of it is plainly a clock. */
    .half { position: absolute; left: 66px; top: -30px;
      font-family: 'Playfair Display', serif; font-weight: 900; font-size: 320px;
      color: oklch(0.95 0.014 88); line-height: 1; }
    .clock { position: absolute; left: 236px; top: 128px; }
  </style>
</helmet>
<div class="icon">
  <span class="half">&lsquo;</span>
  <svg class="clock" width="150" height="150" viewBox="0 0 120 120">
    <circle cx="60" cy="60" r="50" fill="none" stroke="oklch(0.95 0.014 88)" stroke-width="13"/>
    <g stroke="oklch(0.95 0.014 88)" stroke-width="13" stroke-linecap="round">
      <line x1="60" y1="60" x2="60" y2="30"/>
      <line x1="60" y1="60" x2="84" y2="72"/>
    </g>
    <circle cx="60" cy="60" r="7" fill="oklch(0.95 0.014 88)"/>
  </svg>
</div>
</x-dc>
</body>
</html>
