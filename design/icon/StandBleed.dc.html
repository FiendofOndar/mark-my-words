<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    .icon { width: 480px; height: 480px; border-radius: 104px; box-sizing: border-box;
      position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .bleed { background:
        radial-gradient(ellipse 120% 90% at 30% 8%, oklch(0.32 0.09 285), transparent 72%),
        oklch(0.145 0.012 270); }
    .bleed svg { position: absolute; left: -76px; top: -34px; }
  </style>
</helmet>
<div class="icon bleed">
  <!-- Scale 2.45. Bubble clears the edge by ~13px on every side; the tail is
       cropped by the bottom-left corner on purpose. -->
  <svg width="588" height="588" viewBox="0 0 240 240">
    <g transform="translate(9 6)" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M 40.6 143.9 A 86 86 0 1 1 71 180.6 L 10 212 Z" stroke="oklch(0.95 0.014 88)" stroke-width="13"/>
      <line x1="120" y1="106" x2="120" y2="50" stroke="oklch(0.95 0.014 88)" stroke-width="12"/>
      <line x1="120" y1="106" x2="155" y2="126" stroke="oklch(0.95 0.014 88)" stroke-width="12"/>
      <circle cx="120" cy="106" r="7" fill="oklch(0.95 0.014 88)" stroke="none"/>
    </g>
  </svg>
</div>
</x-dc>
</body>
</html>
