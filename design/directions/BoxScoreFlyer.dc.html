<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@600&display=swap">
  <style>
    body { margin: 0; }
    .flyer {
      width: 1200px; height: 630px; box-sizing: border-box; position: relative; overflow: hidden;
      background: oklch(0.16 0.012 270); color: oklch(0.96 0.01 90);
      font-family: 'Barlow Condensed', sans-serif; padding: 72px;
    }
    .grid-bg { position: absolute; inset: 0; opacity: 0.05;
      background-image: linear-gradient(oklch(0.9 0 0) 1px, transparent 1px), linear-gradient(90deg, oklch(0.9 0 0) 1px, transparent 1px);
      background-size: 48px 48px; }
    .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 15px; letter-spacing: 3px; color: oklch(0.74 0.19 150); margin-bottom: 18px; font-weight: 600; }
    h1 { font-family: 'Anton', sans-serif; font-size: 76px; line-height: 0.98; margin: 0 0 22px 0; max-width: 820px; }
    p.sub { font-size: 26px; max-width: 620px; line-height: 1.35; color: oklch(0.78 0.01 90); font-weight: 500; margin: 0 0 40px 0; }
    .stamp { position: absolute; right: 90px; top: 110px; font-family: 'Anton', sans-serif; font-size: 34px;
      border: 5px solid oklch(0.62 0.19 25); color: oklch(0.72 0.19 25); padding: 10px 26px; transform: rotate(9deg);
      border-radius: 6px; letter-spacing: 2px; }
    .record { display: flex; gap: 40px; }
    .rec { font-family: 'IBM Plex Mono', monospace; }
    .rec b { display: block; font-size: 32px; color: oklch(0.74 0.19 150); }
    .rec span { font-size: 14px; letter-spacing: 1px; color: oklch(0.6 0.01 90); text-transform: uppercase; }
  </style>
</helmet>
<div class="flyer">
  <div class="grid-bg"></div>
  <div class="stamp">MISS</div>
  <div class="eyebrow">MARK MY WORDS</div>
  <h1>Say it.<br>We'll keep score.</h1>
  <p class="sub">Capture the claim in one tap. Freeze what it actually said. Let the clock and the evidence do the rest.</p>
  <div class="record">
    <div class="rec"><b>212&ndash;61</b><span>calls tracked</span></div>
    <div class="rec"><b>66%</b><span>league-wide hit rate</span></div>
    <div class="rec"><b>19 mo</b><span>latest late hit</span></div>
  </div>
</div>
</x-dc>
</body>
</html>
