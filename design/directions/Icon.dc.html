<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    .icon {
      width: 480px; height: 480px; border-radius: 104px; box-sizing: border-box;
      background: oklch(0.17 0.012 270);
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }
    .tick { position: absolute; font-family: 'Courier New', monospace; font-weight: 700; font-size: 26px;
      color: oklch(0.4 0.02 270); letter-spacing: 2px; }
    .tick.tl { top: 34px; left: 40px; }
    .tick.br { bottom: 34px; right: 40px; transform: rotate(180deg); }
  </style>
</helmet>
<div class="icon">
  <span class="tick tl">W</span>
  <svg width="240" height="240" viewBox="0 0 240 240" style="transform: rotate(-6deg)">
    <path d="M44 132 L96 184 L200 60" fill="none" stroke="oklch(0.74 0.19 150)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <span class="tick br">L</span>
</div>
</x-dc>
</body>
</html>
