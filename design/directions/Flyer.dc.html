<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <style>
    body { margin: 0; }
    .flyer {
      width: 1200px; height: 630px; box-sizing: border-box; position: relative; overflow: hidden;
      background: oklch(0.16 0.012 270); color: oklch(0.96 0.01 90);
      font-family: 'Barlow Condensed', sans-serif; padding: 64px 72px;
      display: flex; flex-direction: column; gap: 22px;
    }
    .grid-bg { position: absolute; inset: 0; opacity: 0.05;
      background-image: linear-gradient(oklch(0.9 0 0) 1px, transparent 1px), linear-gradient(90deg, oklch(0.9 0 0) 1px, transparent 1px);
      background-size: 48px 48px; }
    .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 15px; letter-spacing: 3px; color: oklch(0.76 0.13 72); font-weight: 600; }
    h1 { font-family: 'Anton', sans-serif; font-size: 68px; line-height: 0.98; margin: 0; max-width: 820px; }
    p.sub { font-size: 24px; max-width: 640px; line-height: 1.35; color: oklch(0.78 0.01 90); font-weight: 500; margin: 0; }
    .stamp { position: absolute; right: 90px; top: 108px; font-family: 'Anton', sans-serif; font-size: 30px;
      background: oklch(0.58 0.16 27); color: oklch(0.98 0.01 90); padding: 10px 28px;
      border-radius: 4px; letter-spacing: 3px; }
    .ticker { display: flex; align-items: center; gap: 22px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px;
      letter-spacing: 0.5px; color: oklch(0.58 0.01 90); border-top: 1px solid oklch(0.3 0.012 270);
      border-bottom: 1px solid oklch(0.3 0.012 270); padding: 11px 0; }
    .ticker .label { text-transform: uppercase; letter-spacing: 2px; color: oklch(0.5 0.01 270); }
    .ticker .src b { color: oklch(0.76 0.13 72); font-weight: 600; margin-left: 5px; }
    .record { display: flex; gap: 40px; }
    .rec { font-family: 'IBM Plex Mono', monospace; font-weight: 500; }
    .rec b { display: block; font-size: 32px; font-weight: 600; color: oklch(0.76 0.13 72); }
    .rec span { font-size: 14px; letter-spacing: 1px; color: oklch(0.6 0.01 90); text-transform: uppercase; }
  </style>
</helmet>
<div class="flyer">
  <div class="grid-bg"></div>
  <div class="stamp">MISS</div>
  <div class="eyebrow">MARK MY WORDS</div>
  <h1>Say it.<br>Let the AI keep score.</h1>
  <p class="sub">It scans the web, checks every source, and calls the verdict itself &mdash; the moment the deadline lands, day or night.</p>
  <div class="ticker">
    <span class="label">Sources verified</span>
    <span class="src">AP NEWS <b>&#10003;</b></span>
    <span class="src">REUTERS <b>&#10003;</b></span>
    <span class="src">ESPN <b>&#10003;</b></span>
  </div>
  <div class="record">
    <div class="rec"><b>212&ndash;61</b><span>calls tracked</span></div>
    <div class="rec"><b>66%</b><span>league-wide hit rate</span></div>
    <div class="rec"><b>19 mo</b><span>latest late hit</span></div>
  </div>
</div>
</x-dc>
</body>
</html>
