<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
  <style>
    body { margin: 0; }
    a { color: oklch(0.85 0.23 130); }
    a:hover { color: oklch(0.9 0.23 130); }
    .phone {
      width: 375px; height: 812px; box-sizing: border-box;
      background: oklch(0.14 0 0); color: oklch(0.97 0 0);
      font-family: 'Source Serif 4', serif;
      display: flex; flex-direction: column;
    }
    .top { padding: 52px 22px 18px 22px; }
    .top h1 { font-family: 'Archivo Black', sans-serif; font-size: 22px; margin: 0; letter-spacing: 0.5px; }
    .list { flex: 1; display: flex; flex-direction: column; gap: 22px; padding: 6px 22px; overflow: hidden; }
    .card { padding-bottom: 20px; border-bottom: 1px solid oklch(0.3 0 0); }
    .author { font-size: 13px; color: oklch(0.6 0 0); margin-bottom: 6px; letter-spacing: 0.3px; }
    .claim { font-size: 21px; font-weight: 600; line-height: 1.2; margin: 0 0 12px 0; }
    .footer { display: flex; align-items: center; justify-content: space-between; }
    .days { font-size: 14px; color: oklch(0.65 0 0); }
    .stamp { font-family: 'Archivo Black', sans-serif; font-size: 15px; padding: 4px 12px; border-radius: 2px; transform: rotate(-4deg); letter-spacing: 1px; }
    .stamp.hit { background: oklch(0.85 0.23 130); color: oklch(0.12 0 0); }
    .stamp.miss { background: oklch(0.4 0.22 340); color: oklch(0.98 0 0); }
  </style>
</helmet>
<div class="phone">
  <div class="top"><h1>MARK MY WORDS</h1></div>
  <div class="list">
    <div class="card">
      <div class="author">@popops</div>
      <p class="claim">"Cardinals win it all this year."</p>
      <div class="footer"><span class="days">41 days out</span></div>
    </div>
    <div class="card">
      <div class="author">fastcompany.com</div>
      <p class="claim">"The AI bubble crashes by spring."</p>
      <div class="footer"><span class="days">Resolved Sep 2</span><span class="stamp miss">MISS</span></div>
    </div>
    <div class="card">
      <div class="author">@jordan</div>
      <p class="claim">"Neighbors drop the gutter thing by Nov."</p>
      <div class="footer"><span class="days">Resolved Aug 30</span><span class="stamp hit">HIT</span></div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
