<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Source+Serif+4:opsz,wght@8..60,500&display=swap">
  <style>
    body { margin: 0; }
    .flyer {
      width: 1200px; height: 630px; box-sizing: border-box; position: relative; overflow: hidden;
      background: oklch(0.14 0 0); color: oklch(0.97 0 0);
      font-family: 'Source Serif 4', serif; padding: 0;
      display: flex; align-items: center;
    }
    .hero { font-family: 'Archivo Black', sans-serif; font-size: 210px; line-height: 0.82; color: oklch(0.85 0.23 130);
      position: absolute; left: -14px; top: 40px; letter-spacing: -6px; transform: rotate(-4deg); }
    .content { position: relative; margin-left: 560px; padding: 60px 70px 60px 0; }
    .eyebrow { font-family: 'Archivo Black', sans-serif; font-size: 16px; letter-spacing: 3px; color: oklch(0.65 0.25 340); margin-bottom: 18px; }
    p.sub { font-size: 26px; line-height: 1.4; max-width: 480px; color: oklch(0.85 0 0); margin: 0 0 30px 0; }
    .record { font-family: 'Archivo Black', sans-serif; font-size: 15px; color: oklch(0.6 0 0); letter-spacing: 0.5px; }
  </style>
</helmet>
<div class="flyer">
  <div class="hero">MISS.</div>
  <div class="content">
    <div class="eyebrow">MARK MY WORDS</div>
    <p class="sub">Capture the claim. Freeze what it actually said. Let the clock and the evidence do the rest.</p>
    <div class="record">212 CALLS &middot; 66% HIT RATE &middot; ZERO MERCY</div>
  </div>
</div>
</x-dc>
