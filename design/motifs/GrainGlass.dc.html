<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <style>
    body { margin: 0; }
    .swatch {
      width: 400px; height: 460px; box-sizing: border-box; position: relative; overflow: hidden;
      background: oklch(0.15 0.012 270);
      font-family: 'IBM Plex Mono', monospace;
    }
    .grain { position: absolute; inset: 0; opacity: 0.05;
      background-image: radial-gradient(oklch(0.9 0 0) 1px, transparent 1px);
      background-size: 3px 3px; }
    .label { position: absolute; top: 20px; left: 20px; font-size: 11px; letter-spacing: 2px; color: oklch(0.5 0.01 270); text-transform: uppercase; }
    .glass {
      position: absolute; left: 32px; right: 32px; bottom: 60px;
      background: oklch(0.94 0.01 90 / 0.07);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid oklch(0.9 0.01 90 / 0.14);
      border-radius: 10px;
      padding: 20px 22px;
      box-shadow: 0 12px 30px oklch(0 0 0 / 0.35);
    }
    .glass .who { font-size: 10.5px; letter-spacing: 1.5px; color: oklch(0.76 0.13 72); text-transform: uppercase; margin-bottom: 8px; font-weight: 600; }
    .glass .verdict { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 24px; color: oklch(0.96 0.01 90); margin: 0 0 6px 0; }
    .glass .detail { font-size: 12px; color: oklch(0.68 0.01 90); line-height: 1.4; }
    .card { position: absolute; top: 70px; left: 32px; right: 32px; height: 130px; background: oklch(0.19 0.012 270);
      border-radius: 6px; border: 1px solid oklch(0.26 0.01 270); }
    .card .stmt { position: absolute; top: 16px; left: 18px; right: 18px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: oklch(0.72 0.01 90); line-height: 1.5; }
  </style>
</helmet>
<div class="swatch">
  <div class="grain"></div>
  <div class="label">Grain + glass panel</div>
  <div class="card"><div class="stmt">"Cardinals win it all this year." &mdash; @popops, said Mar 12</div></div>
  <div class="glass">
    <div class="who">AI VERDICT</div>
    <p class="verdict">HIT &mdash; confirmed</p>
    <p class="detail">3 sources checked. Every citation resolved before the deadline.</p>
  </div>
</div>
</x-dc>
</body>
</html>
