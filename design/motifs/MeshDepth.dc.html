<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <style>
    body { margin: 0; }
    .swatch {
      width: 400px; height: 460px; box-sizing: border-box; position: relative; overflow: hidden;
      background:
        radial-gradient(ellipse 480px 340px at 18% 12%, oklch(0.22 0.03 72 / 0.55), transparent 60%),
        radial-gradient(ellipse 420px 380px at 88% 92%, oklch(0.2 0.03 25 / 0.4), transparent 60%),
        oklch(0.15 0.012 270);
      color: oklch(0.96 0.01 90);
      font-family: 'IBM Plex Mono', monospace;
      padding: 24px;
    }
    .label { font-size: 11px; letter-spacing: 2px; color: oklch(0.55 0.01 270); text-transform: uppercase; margin-bottom: 140px; }
    .rec b { display: block; font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 56px; color: oklch(0.8 0.13 72); }
    .rec span { font-size: 13px; letter-spacing: 1px; color: oklch(0.65 0.01 90); text-transform: uppercase; }
  </style>
</helmet>
<div class="swatch">
  <div class="label">Ultra-subtle mesh, not a hero gradient</div>
  <div class="rec"><b>212&ndash;61</b><span>calls tracked, all-time</span></div>
</div>
</x-dc>
</body>
</html>
