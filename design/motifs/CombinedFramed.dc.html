<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;1,500&family=Oswald:wght@600;700&family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <style>
    body { margin: 0; }
    .card {
      width: 360px; height: 680px; box-sizing: border-box; position: relative; overflow: hidden;
      background:
        radial-gradient(ellipse 320px 260px at -6% -4%, oklch(0.26 0.07 72 / 0.38), transparent 65%),
        radial-gradient(ellipse 300px 260px at 106% 104%, oklch(0.22 0.06 25 / 0.3), transparent 65%),
        oklch(0.145 0.012 270);
      color: oklch(0.96 0.01 90);
      font-family: 'IBM Plex Mono', monospace;
      display: flex; flex-direction: column;
    }
    .grain { position: absolute; inset: 0; opacity: 0.045; pointer-events: none;
      background-image: radial-gradient(oklch(0.9 0 0) 1px, transparent 1px); background-size: 3px 3px; }
    .label { padding: 44px 26px 0 26px; font-size: 11px; letter-spacing: 2px; color: oklch(0.52 0.01 270); text-transform: uppercase; text-align: center; }
    .quote-zone { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 40px; text-align: center; }
    .quote { font-family: 'Cormorant', serif; font-weight: 500; font-style: italic; font-size: 32px; line-height: 1.3; margin: 0; color: oklch(0.96 0.01 90); }
    .who { font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 15px; color: oklch(0.72 0.01 90); text-align: center; margin-bottom: 26px; }
    .who span { color: oklch(0.5 0.01 90); font-weight: 500; }
    .glass {
      margin: 0 22px 30px 22px; padding: 22px 24px; border-radius: 14px; position: relative;
      background: oklch(0.94 0.01 90 / 0.06);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    .glass::before {
      content: ''; position: absolute; inset: 0; border-radius: 14px; padding: 1px;
      background: linear-gradient(135deg, oklch(0.78 0.13 72 / 0.7), oklch(0.9 0.01 90 / 0.05) 40%, transparent 70%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      pointer-events: none;
    }
    .glass .tag { font-size: 10.5px; letter-spacing: 1.5px; color: oklch(0.78 0.13 72); text-transform: uppercase; font-weight: 600; margin-bottom: 10px; }
    .glass .verdict { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 28px; margin: 0 0 8px 0; }
    .glass .detail { font-size: 12px; color: oklch(0.68 0.01 90); line-height: 1.5; }
  </style>
</helmet>
<div class="card">
  <div class="grain"></div>
  <div class="label">Resolved</div>
  <div class="quote-zone"><p class="quote">&ldquo;The Cardinals win it all this year.&rdquo;</p></div>
  <div class="who">@popops <span>&middot; said Mar 12 &middot; sports</span></div>
  <div class="glass">
    <div class="tag">AI Verdict</div>
    <p class="verdict">HIT</p>
    <p class="detail">3 sources checked &mdash; AP, ESPN, MLB.com. Every citation confirmed before the deadline.</p>
  </div>
</div>
</x-dc>
</body>
</html>
