<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Barlow+Condensed:wght@600&display=swap">
  <style>
    body { margin: 0; }
    .swatch {
      width: 400px; height: 460px; box-sizing: border-box; position: relative; overflow: hidden;
      background: oklch(0.15 0.012 270); color: oklch(0.96 0.01 90);
      font-family: 'IBM Plex Mono', monospace;
    }
    .label { position: absolute; top: 20px; left: 20px; font-size: 11px; letter-spacing: 2px; color: oklch(0.5 0.01 270); text-transform: uppercase; z-index: 2; }
    svg { position: absolute; inset: 0; }
    .cap { position: absolute; bottom: 26px; left: 24px; right: 24px; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 15px; color: oklch(0.82 0.01 90); }
    .cap b { color: oklch(0.76 0.13 72); }
  </style>
</helmet>
<div class="swatch">
  <div class="label">Citation network as texture</div>
  <svg viewBox="0 0 400 460" width="400" height="460">
    <g stroke="oklch(0.3 0.01 270)" stroke-width="1.5" fill="none">
      <line x1="200" y1="200" x2="90" y2="120"/>
      <line x1="200" y1="200" x2="300" y2="110"/>
      <line x1="200" y1="200" x2="80" y2="270"/>
      <line x1="200" y1="200" x2="310" y2="260"/>
      <line x1="200" y1="200" x2="150" y2="340"/>
      <line x1="90" y1="120" x2="150" y2="60"/>
      <line x1="310" y1="260" x2="340" y2="330"/>
    </g>
    <circle cx="200" cy="200" r="9" fill="oklch(0.76 0.13 72)"/>
    <g fill="oklch(0.45 0.01 270)">
      <circle cx="90" cy="120" r="5"/>
      <circle cx="300" cy="110" r="5"/>
      <circle cx="80" cy="270" r="5"/>
      <circle cx="310" cy="260" r="5"/>
      <circle cx="150" cy="340" r="5"/>
      <circle cx="150" cy="60" r="4"/>
      <circle cx="340" cy="330" r="4"/>
    </g>
  </svg>
  <div class="cap">Claim confirmed against <b>3 independent sources</b>, cross-referenced automatically.</div>
</div>
</x-dc>
</body>
</html>
