ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'

    // Pinned deliberately. Three Capacitor plugins each put their own default
    // Kotlin Gradle plugin version on the classpath (2.2.20, 2.0.21, 1.9.25),
    // and Gradle will not load the same plugin at different versions across
    // sibling subprojects. Setting it here makes every plugin agree.
    kotlin_version = '2.2.20'
    kotlinxCoroutinesVersion = '1.10.2'
}